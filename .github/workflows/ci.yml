# =============================================================================
# CI.
#
# Requires no vendor credentials. Every provider resolves to its fake, so the
# full provisioning path — including the steps that would spend money — runs on
# every push with no network access and no Twilio, ElevenLabs, Stripe or email
# account involved. That property is the reason the provider Protocols exist;
# this workflow is what stops it from quietly regressing.
#
# Jobs are split so a failure names its own cause. A red "types" job means
# mypy; it does not mean scrolling a combined log to find out.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same ref. `main` is exempt:
# its runs are the record of what was green when it merged.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "24"
  UV_VERSION: "0.5.11"

jobs:
  # ---------------------------------------------------------------------------
  backend-lint:
    name: backend / lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run ruff check --output-format=github .
        working-directory: backend
      - run: uv run ruff format --check .
        working-directory: backend

  # ---------------------------------------------------------------------------
  backend-types:
    name: backend / types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run mypy .
        working-directory: backend

  # ---------------------------------------------------------------------------
  backend-tests:
    name: backend / tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: receptionist
          POSTGRES_PASSWORD: receptionist
          POSTGRES_DB: receptionist_test
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U receptionist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # A real PostgreSQL, never SQLite. The schema leans on JSONB, partial
      # unique indexes and FOR UPDATE SKIP LOCKED; a SQLite stand-in would pass
      # while proving nothing about the constraints that protect the money path.
      TEST_DATABASE_URL: postgresql+asyncpg://receptionist:receptionist@localhost:5432/receptionist_test
      REDIS_URL: redis://localhost:6379/15
      DRY_RUN: "true"
      # The Temporal tests use the SDK's in-process time-skipping server, which
      # downloads a small binary on first run. No Temporal service is needed.
      ORCHESTRATOR: state_machine
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
        working-directory: backend

      - name: Assert the database is actually reachable
        # The suite skips its database tests when PostgreSQL is unreachable,
        # which is right on a laptop and wrong in CI: it would turn a broken
        # service container into a green run with 168 silent skips. Fail loudly
        # instead.
        run: uv run python -c "
          import asyncio, os, sys;
          from sqlalchemy.ext.asyncio import create_async_engine;
          url = os.environ['TEST_DATABASE_URL'].rpartition('/')[0] + '/postgres';
          async def main():
              engine = create_async_engine(url)
              try:
                  async with engine.connect(): pass
              finally:
                  await engine.dispose()
          asyncio.run(main())
          "
        working-directory: backend

      - run: uv run pytest -q
        working-directory: backend

      - name: No unexpected skips
        # Guards the assertion above end to end: if the database tests start
        # skipping again for any reason, this job goes red rather than quietly
        # testing half the system.
        run: |
          uv run pytest -q --tb=no -rs 2>&1 | tee /tmp/pytest.log
          if grep -q "PostgreSQL is not reachable" /tmp/pytest.log; then
            echo "::error::Database tests skipped in CI — the service container is not being used."
            exit 1
          fi
        working-directory: backend

  # ---------------------------------------------------------------------------
  migrations:
    name: backend / migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: receptionist
          POSTGRES_PASSWORD: receptionist
          POSTGRES_DB: receptionist_migrations
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U receptionist"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://receptionist:receptionist@localhost:5432/receptionist_migrations
      DRY_RUN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
        working-directory: backend

      - name: Single head
        # Two heads means two branches added a migration without rebasing. It
        # is trivial to fix now and an outage to discover during a deploy.
        run: |
          heads=$(uv run alembic heads | grep -c '(head)' || true)
          if [ "$heads" -ne 1 ]; then
            echo "::error::Expected exactly one Alembic head, found $heads."
            uv run alembic heads
            exit 1
          fi
        working-directory: backend

      - name: Upgrade to head
        run: uv run alembic upgrade head
        working-directory: backend

      - name: Models and migrations agree
        # Catches the change that edits a model and forgets the migration. The
        # symptom otherwise appears in production as a missing column.
        run: |
          uv run alembic check || {
            echo "::error::Models have drifted from migrations. Run: alembic revision --autogenerate"
            exit 1
          }
        working-directory: backend

      - name: Downgrade is implemented
        # Not proof the rollback is correct, but proof one exists. A migration
        # with an empty downgrade() is discovered here, not during an incident.
        run: uv run alembic downgrade base
        working-directory: backend

  # ---------------------------------------------------------------------------
  frontend:
    name: frontend / lint + types + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # ---------------------------------------------------------------------------
  security:
    name: security / secrets + dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No committed .env
        # The templates are committed; a real .env never is. This is the cheap
        # check that catches the expensive mistake.
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked by git. Remove it and rotate every credential it held."
            exit 1
          fi

      - name: No credential-shaped literals in source
        # Deliberately narrow: real vendor key prefixes only. A broad "secret"
        # grep produces noise, gets ignored, and then misses the real thing.
        run: |
          set +e
          matches=$(grep -rInE \
            '(sk_live_|sk_test_[A-Za-z0-9]{16,}|rk_live_|whsec_[A-Za-z0-9]{16,}|AC[0-9a-f]{32}|SG\.[A-Za-z0-9_-]{20,}|xoxb-|AKIA[0-9A-Z]{16})' \
            --include='*.py' --include='*.ts' --include='*.tsx' --include='*.yml' --include='*.yaml' \
            --exclude-dir=node_modules --exclude-dir=.git . )
          set -e
          if [ -n "$matches" ]; then
            echo "::error::Credential-shaped literal found in source:"
            echo "$matches"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Python dependency audit
        # Advisory: a new CVE in a transitive dependency should be visible on
        # the next run, but it should not block an unrelated pull request.
        continue-on-error: true
        run: uvx pip-audit --strict --progress-spinner off
        working-directory: backend

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Node dependency audit
        continue-on-error: true
        run: npm audit --audit-level=high
        working-directory: frontend

  # ---------------------------------------------------------------------------
  docker:
    name: docker / images + compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Compose file is valid
        run: docker compose --env-file .env.local.example config --quiet

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: runtime
          push: false
          load: true
          tags: ai-receptionist-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Backend image starts and imports the app
        # Catches the dependency that is present in the lockfile but missing
        # from the runtime stage — a failure that otherwise appears only on
        # first boot in a deployed environment.
        run: |
          docker run --rm -e DATABASE_URL=postgresql+asyncpg://u:p@localhost/db \
            ai-receptionist-backend:ci python -c "import app.asgi; print('import ok')"

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: runtime
          push: false
          load: true
          tags: ai-receptionist-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
