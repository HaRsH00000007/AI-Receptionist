[project]
name = "ai-receptionist-backend"
version = "0.1.0"
description = "AI Receptionist — FastAPI backend (POC)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    # One async HTTP client for every provider. Twilio/ElevenLabs SDKs are
    # sync-only, and this keeps the whole call path awaitable.
    "httpx>=0.27",
    # Twilio posts its webhooks form-encoded; Starlette needs this to read them.
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    # Twilio posts its webhooks form-encoded; Starlette needs this to read them.
    "python-multipart>=0.0.9",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# -----------------------------------------------------------------------------
# Tests
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]

# -----------------------------------------------------------------------------
# Lint / format
# -----------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "ASYNC",  # async correctness
    "C4",     # comprehensions
    "BLE",    # no blind excepts
    "RUF",    # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# FastAPI expresses parameter metadata as calls in defaults; that is the
# framework's idiom, not the mutable-default bug B008 targets.
"app/api/*" = ["B008"]
# Migration bodies are autogenerated; a long index predicate is more
# readable on one line than wrapped, and rewriting them invites drift.
"migrations/versions/*" = ["E501"]

# -----------------------------------------------------------------------------
# Types
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = "migrations.versions.*"
# Autogenerated bodies; the env.py that runs them is checked normally.
disallow_untyped_defs = false
